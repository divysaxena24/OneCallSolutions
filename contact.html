<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Call Solutions</title>

  <link rel="icon" href="source/logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="public/contact.css" />

  <style>
    .is-invalid {
      border: 2px solid #dc3545 !important;
      box-shadow: 0 0 0 0.15rem rgba(220, 53, 69, 0.25);
    }
    .invalid-feedback {
      display: none;
      color: #dc3545;
      font-size: 13px;
    }
  </style>
</head>

<body>

<section id="contact">
  <div class="container mt-3 pt-3">
    <h2>Contact Us</h2>

    <form id="contactForm" novalidate>
      <div class="form-group">
        <input type="text" id="name" required pattern="[A-Za-z\s]{2,50}" />
        <label>Your Name</label>
        <div class="invalid-feedback">Please enter a valid name</div>
      </div>

      <div class="form-group">
        <input type="email" id="email" required />
        <label>Your Email</label>
        <div class="invalid-feedback">Please enter a real email</div>
      </div>

      <div class="form-group">
        <input type="tel" id="phone" required pattern="[0-9]{10}" maxlength="10" />
        <label>Phone Number</label>
        <div class="invalid-feedback">Enter 10-digit phone number</div>
      </div>

      <div class="form-group">
        <textarea id="message" required minlength="10"></textarea>
        <label>Your Message</label>
        <div class="invalid-feedback">Message must be 10+ characters</div>
      </div>

      <div class="form-check mb-3 d-flex align-items-start">
        <input class="form-check-input mt-1" type="checkbox" id="consent" />
        <label class="form-check-label ms-2" for="consent">
          I consent to receiving RCS, WhatsApp, Email or SMS from One Call Solutions &amp;
          agree to <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
        </label>
        <div class="invalid-feedback">Consent is required</div>
      </div>

      <button type="submit">Send Message</button>
      <p id="responseMessage"></p>
    </form>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
emailjs.init("AdzdjQ8_16IJENrxG");

document.getElementById("contactForm").addEventListener("submit", function (e) {
  e.preventDefault();

  clearErrors();

  if (!validateField("name")) return;
  if (!validateEmail()) return;
  if (!validateField("phone")) return;
  if (!validateField("message")) return;
  if (!validateConsent()) return;

  sendEmail();
});

function validateField(id) {
  const el = document.getElementById(id);
  const error = el.nextElementSibling.nextElementSibling;

  if (!el.checkValidity() || el.value.trim() === "") {
    el.classList.add("is-invalid");
    error.style.display = "block";
    el.focus();
    return false;
  }
  return true;
}

function validateEmail() {
  const email = document.getElementById("email");
  const error = email.nextElementSibling.nextElementSibling;
  const emailValue = email.value.trim();

  // Basic email format validation
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(emailValue)) {
    email.classList.add("is-invalid");
    error.style.display = "block";
    error.textContent = "Please enter a valid email address";
    email.focus();
    return false;
  }

  // Convert to lowercase for comparison
  const lowerEmail = emailValue.toLowerCase();

  // Check for common dummy email patterns
  const dummyPatterns = ['test', 'fake', 'dummy', 'example', 'admin'];
  for (const pattern of dummyPatterns) {
    if (lowerEmail.includes(pattern)) {
      email.classList.add("is-invalid");
      error.style.display = "block";
      error.textContent = "Please enter a valid email address";
      email.focus();
      return false;
    }
  }

  // Extract domain and check for valid TLD
  const domain = lowerEmail.split('@')[1];
  const validTldPattern = /\.([a-z]{2,}|[a-z]{2,}\.[a-z]{2,})$/i;
  if (!validTldPattern.test(domain)) {
    email.classList.add("is-invalid");
    error.style.display = "block";
    error.textContent = "Please enter a valid email address";
    email.focus();
    return false;
  }

  return true;
}

function validateConsent() {
  const consent = document.getElementById("consent");
  const error = consent.closest('.form-check').querySelector(".invalid-feedback");

  if (!consent.checked) {
    consent.classList.add("is-invalid");
    error.style.display = "block";
    consent.focus();
    return false;
  }
  return true;
}

function clearErrors() {
  document.querySelectorAll(".is-invalid").forEach(el => el.classList.remove("is-invalid"));
  document.querySelectorAll(".invalid-feedback").forEach(el => el.style.display = "none");
}

function sendEmail() {
  emailjs.sendForm("service_p3ixm6k", "template_kt1xpni", "#contactForm")
    .then(() => {
      document.getElementById("responseMessage").innerText = "✅ Message sent successfully!";
      document.getElementById("responseMessage").style.color = "green";
    })
    .catch(() => {
      document.getElementById("responseMessage").innerText = "❌ Failed to send message.";
      document.getElementById("responseMessage").style.color = "red";
    });
}
</script>

</body>
</html>
